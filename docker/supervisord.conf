[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ---- background workers (same image; to scale them separately run the container with the command shown) ----
; RUN_WORKERS=false (env) starts ONLY php-fpm + nginx: use it for extra API replicas, so consumers and the
; scheduler run once (scale those as their own containers with the command shown above each program).

; Handles events from ProductService.   command: php artisan rabbitmq:consume inventory.catalog
[program:rabbitmq-consumer-catalog]
command=php /var/www/html/artisan rabbitmq:consume inventory.catalog
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Handles events from OrderService (confirm / cancel / ship / return).   command: php artisan rabbitmq:consume inventory.orders
[program:rabbitmq-consumer-orders]
command=php /var/www/html/artisan rabbitmq:consume inventory.orders
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Sends this service's own events (inventory.*) to RabbitMQ.   command: php artisan outbox:publish
[program:outbox-publisher]
command=php /var/www/html/artisan outbox:publish
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Runs routes/console.php schedule (expire reservations every minute, pruning, monitoring).   command: php artisan schedule:work
; Run ONE scheduler only: if you run several replicas of this container, set the scheduler on one of them
; (or keep withoutOverlapping, which uses the shared cache lock).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
